<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NISIALAND · Primeiro Pavimento 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#9bdcff;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%}.hud{position:fixed;z-index:4;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.hud>*{pointer-events:auto}.panel{background:#fffffff0;border:2px solid #bae6fd;border-radius:14px;padding:8px 12px;color:#1e3a8a;font-weight:800;box-shadow:0 4px 0 #7dd3fc}.hint{position:fixed;z-index:4;bottom:14px;left:50%;transform:translateX(-50%);background:#0f172acc;color:#fff;border-radius:99px;padding:8px 14px;font-weight:700}.joystick{position:fixed;z-index:4;bottom:20px;left:20px;width:110px;height:110px;border:3px solid #ffffffaa;border-radius:50%;background:#ffffff44}.stick{position:absolute;width:48px;height:48px;left:28px;top:28px;border-radius:50%;background:#fbbf24;border:3px solid #b45309}.stations{position:fixed;right:12px;bottom:12px;z-index:4;background:#fffffff0;border:2px solid #fbbf24;border-radius:14px;padding:8px;font-size:12px;color:#334155}.station{margin:3px 0}.station b{color:#047857}.bubble{position:fixed;z-index:5;transform:translate(-50%,-100%);background:#fff;border:3px solid #f59e0b;border-radius:16px;padding:8px 10px;font-weight:800;max-width:210px;display:none}.btn{border:2px solid #1e3a8a;background:#2563eb;color:#fff;border-radius:10px;padding:8px 10px;font-weight:800}</style></head><body><div class="hud"><div class="panel"><b>NISIALAND · NÍVEL 2</b><br><span id="goal">Entrada principal · caminhe até a estação</span></div><button class="btn" id="back">Voltar</button></div><div class="hint">WASD/setas para andar · arraste para girar · aproxime-se das estações</div><div class="joystick" id="joy"><div class="stick" id="stick"></div></div><div class="stations" id="stations"></div><div class="bubble" id="bubble"></div><canvas id="scene" aria-label="Primeiro pavimento 3D da escola"></canvas><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
const canvas=document.getElementById('scene'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight,false);const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bdcff);scene.fog=new THREE.Fog(0x9bdcff,35,85);const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,200);scene.add(new THREE.HemisphereLight(0xffffff,0x6b7280,1.4));const sun=new THREE.DirectionalLight(0xfff1c1,1);sun.position.set(-20,30,15);scene.add(sun);const mat=(c)=>new THREE.MeshLambertMaterial({color:c});const wall=mat(0xf4efe4),blue=mat(0x2563eb),wood=mat(0x9a6a43),floor=mat(0xe6d9c5),green=mat(0x37a56b),yellow=mat(0xfbbf24),npcMat=mat(0xffffff);
function box(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}function label(text,x,z,color='#1e3a8a'){const c=document.createElement('canvas');c.width=420;c.height=70;const g=c.getContext('2d');g.fillStyle='rgba(255,255,255,.92)';g.roundRect(3,3,414,64,14);g.fill();g.fillStyle=color;g.font='bold 25px Arial';g.textAlign='center';g.fillText(text,210,44);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.position.set(x,2.7,z);s.scale.set(5.4,.9,1);scene.add(s);return s}
// Primeiro pavimento: entrada inferior, corredor central, salas laterais, coordenação e fundos.
box(34,.25,38,floor,0,0,0);box(38,3,.35,wall,0,1.5,-19);box(.35,3,38,wall,-17,1.5,0);box(.35,3,38,wall,17,1.5,0);box(38,3,.35,wall,0,1.5,19);
// corredor central e divisórias dos ambientes
box(5,2.7,30,mat(0xfaf4e8),0,1.35,1);for(const z of[-13,-6,1,8,14]){box(12,2.6,.25,wall,-10.8,1.3,z);box(12,2.6,.25,wall,10.8,1.3,z)}
const rooms=[['ATENDIMENTO',-10.8,-16],['INFORMÁTICA',-10.8,-9],['ESTOQUE',-10.8,-2],['ATENDIMENTO',-10.8,5],['ATENDIMENTO',-10.8,12],['SALA DE AULA',10.8,-16],['SALA DE AULA',10.8,-9],['SALA DE AULA',10.8,-2],['SALA DE AULA',10.8,5],['COORDENAÇÃO',10.8,13]];rooms.forEach(([t,x,z])=>label(t,x,z,x<0?'#047857':'#1e3a8a'));label('CORREDOR CENTRAL',0,1,'#1e3a8a');label('REFEITÓRIO',0,-16,'#b45309');label('COZINHA',14,-16,'#b45309');label('SALA DOS PROFESSORES',10,10,'#7c3aed');label('ENTRADA PRINCIPAL',0,18,'#b45309');label('PÁTIO DOS FUNDOS / QUADRA',0,-21,'#047857');
// mesas visuais das salas
for(const x of[-11,11])for(const z of[-14,-7,0,7])for(let i=0;i<3;i++)box(.8,.25,.5,wood,x+(x<0?i-1:i-1)*1.7,z?1:1,z+i*1.2-1.2);
function npc(name,src,x,z){const tex=new THREE.TextureLoader().load(src);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));s.position.set(x,2,z);s.scale.set(2.3,4.2,1);s.userData.name=name;scene.add(s);return s}npc('Diretor Márcio','/assets/diretor_marcio_hd.png',-11,17);npc('Coordenadora Vânia','/assets/coordenadora_vania.png',13,13);npc('Orientadora Leia','/assets/orientadora_leia.png',-14,12);npc('Zé Cartinha','/assets/ze_cartinha.png',4,-15);npc('Mané Zoeira','/assets/mane_zoeira.png',-4,-15);
const activities=[['n2_ditado','Ditado do Márcio',-11,17],['n2_caca','Caça-palavras',-14,-9],['n2_mural','Mural da Vânia',13,13],['n2_bilhete','Bilhete da Leia',-14,12],['n2_relogio','Corrida',0,0],['n2_duelo','Duelo de bafo',4,-15]];const completed=Number(new URLSearchParams(location.search).get('completed')||0);const rings=[];activities.forEach((a,i)=>{const r=new THREE.Mesh(new THREE.RingGeometry(.7,.95,32),new THREE.MeshBasicMaterial({color:i<completed?0x10b981: i===completed?0xf59e0b:0x94a3b8,side:THREE.DoubleSide}));r.rotation.x=-Math.PI/2;r.position.set(a[2],.03,a[3]);scene.add(r);rings.push(r)});document.getElementById('stations').innerHTML=activities.map((a,i)=>`<div class="station"><b>${i<completed?'✓':i===completed?'▶':'🔒'}</b> ${a[1]}</div>`).join('');
const player=npc('Você','/assets/student_boy_tshirt.png',0,17);player.scale.set(1.8,3.3,1);const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let yaw=0,drag=null;canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,id:e.pointerId};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId){yaw-=(e.clientX-drag.x)*.006;drag.x=e.clientX}});canvas.addEventListener('pointerup',()=>drag=null);const joy=document.getElementById('joy'),stick=document.getElementById('stick');let jx=0,jz=0,jid=null;function jm(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=r.width/2-18,d=Math.hypot(dx,dy),k=Math.min(1,m/d);jx=dx*k/m;jz=dy*k/m;stick.style.transform=`translate(${dx*k}px,${dy*k}px)`}joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)};joy.onpointermove=e=>{if(e.pointerId===jid)jm(e)};joy.onpointerup=joy.onpointercancel=()=>{jid=null;jx=jz=0;stick.style.transform=''};
function near(){const target=activities[completed];if(!target)return false;return Math.hypot(player.position.x-target[2],player.position.z-target[3])<2.5}function loop(){requestAnimationFrame(loop);let mx=jx,mz=jz;if(keys.w||keys.arrowup)mz-=1;if(keys.s||keys.arrowdown)mz+=1;if(keys.a||keys.arrowleft)mx-=1;if(keys.d||keys.arrowright)mx+=1;const d=Math.hypot(mx,mz);if(d>.05){const a=Math.atan2(mx,mz)+yaw;player.position.x=Math.max(-15.5,Math.min(15.5,player.position.x+Math.sin(a)*.12));player.position.z=Math.max(-17,Math.min(17,player.position.z+Math.cos(a)*.12))}const cam=new THREE.Vector3(player.position.x+Math.sin(yaw)*6,4,player.position.z+Math.cos(yaw)*6);camera.position.lerp(cam,.12);camera.lookAt(player.position.x,1.4,player.position.z);const goal=document.getElementById('goal');goal.textContent=completed<activities.length?`Caminhe até: ${activities[completed][1]}${near()?' · clique no anel para jogar':''}`:'Primeiro pavimento concluído';renderer.render(scene,camera)}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});document.getElementById('back').onclick=()=>history.back();canvas.addEventListener('click',()=>{if(near()){parent.postMessage({type:'NISIALAND_LEVEL2_STATION',activityId:activities[completed][0]},location.origin)}});loop();
</script></body></html>
